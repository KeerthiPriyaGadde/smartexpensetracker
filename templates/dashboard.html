<!DOCTYPE html>
<html>

<head>
    <title>Smart Expense Tracker</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="dashboard">

    <!-- HEADER -->
    <div class="header">

        <h1>Smart Expense Tracker</h1>

        <div>
            Welcome, {{ name }}

            <a href="/logout">
                <button>Logout</button>
            </a>
        </div>

    </div>


    <!-- SUMMARY CARDS -->
    <div class="cards">

        <div class="card">
            <h3>Total Income</h3>
            <p id="income">₹0</p>
        </div>

        <div class="card">
            <h3>Total Expense</h3>
            <p id="expense">₹0</p>
        </div>

        <div class="card">
            <h3>Balance</h3>
            <p id="balance">₹0</p>
        </div>

    </div>


    <!-- ADD TRANSACTION -->
    <div class="form-box">

        <h2>Add Transaction</h2>

        <select id="type">

            <option value="income">Income</option>

            <option value="expense">Expense</option>

        </select>


        <select id="category">

            <option>Salary</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Education</option>
            <option>Other</option>

        </select>


        <input
            type="number"
            id="amount"
            placeholder="Enter Amount"
        >


        <input
            type="text"
            id="description"
            placeholder="Enter Description"
        >


        <button onclick="addTransaction()">
            Add Transaction
        </button>

    </div>


    <!-- TRANSACTION HISTORY -->
    <h2>Transaction History</h2>

    <table>

        <thead>

            <tr>
                <th>Type</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Description</th>
                <th>Date</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="transactionTable">

        </tbody>

    </table>

</div>


<!-- JAVASCRIPT -->
<script src="/static/script.js"></script>

</body>

</html>
